<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="640" height="460" rx="16" fill="url(#heroBgGrad)"/>
  
  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="460"/>
    <line x1="160" y1="0" x2="160" y2="460"/>
    <line x1="240" y1="0" x2="240" y2="460"/>
    <line x1="320" y1="0" x2="320" y2="460"/>
    <line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="480" y1="0" x2="480" y2="460"/>
    <line x1="560" y1="0" x2="560" y2="460"/>
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="0" y1="400" x2="640" y2="400"/>
  </g>

  <!-- Machine Base (Continuous Band Sealer FR-900 Illustration) -->
  <g transform="translate(60, 110)">
    <!-- Stand / Frame -->
    <rect x="50" y="220" width="420" height="15" rx="3" fill="#475569"/>
    <rect x="70" y="235" width="20" height="45" fill="#334155"/>
    <rect x="430" y="235" width="20" height="45" fill="#334155"/>

    <!-- Conveyor Bed -->
    <rect x="40" y="160" width="440" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Conveyor Belt -->
    <rect x="50" y="170" width="420" height="24" rx="3" fill="#0f172a"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="80" y1="170" x2="80" y2="194"/>
      <line x1="120" y1="170" x2="120" y2="194"/>
      <line x1="160" y1="170" x2="160" y2="194"/>
      <line x1="200" y1="170" x2="200" y2="194"/>
      <line x1="240" y1="170" x2="240" y2="194"/>
      <line x1="280" y1="170" x2="280" y2="194"/>
      <line x1="320" y1="170" x2="320" y2="194"/>
      <line x1="360" y1="170" x2="360" y2="194"/>
      <line x1="400" y1="170" x2="400" y2="194"/>
      <line x1="440" y1="170" x2="440" y2="194"/>
    </g>

    <!-- Sealing Head Housing -->
    <rect x="100" y="30" width="320" height="110" rx="8" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Control Panel -->
    <rect x="120" y="45" width="100" height="80" rx="4" fill="#0f172a" stroke="#334155"/>
    <rect x="130" y="55" width="35" height="20" rx="2" fill="#ef4444" opacity="0.9"/>
    <text x="147" y="69" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">180°C</text>
    
    <circle cx="185" cy="65" r="7" fill="#334155" stroke="#f97316"/>
    <circle cx="145" cy="100" r="6" fill="#22c55e"/>
    <circle cx="170" cy="100" r="6" fill="#ef4444"/>
    <circle cx="195" cy="100" r="6" fill="#eab308"/>

    <!-- Heating Block & Cooling Block inside Sealing Head -->
    <rect x="240" y="60" width="70" height="28" rx="2" fill="#ea580c" opacity="0.9" stroke="#f97316" stroke-width="1.5"/>
    <text x="275" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">HEATER</text>

    <rect x="320" y="60" width="70" height="28" rx="2" fill="#0284c7" opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="355" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">COOLING</text>

    <!-- Teflon Belt Guide Loop in action -->
    <path d="M 230 74 L 400 74" stroke="#fbbf24" stroke-width="5" stroke-dasharray="8,4"/>
  </g>

  <!-- Interactive Callout Badges with shadows -->
  <!-- Callout 1: Heating Element -->
  <g transform="translate(420, 45)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="190" height="56" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="14" fill="#f97316" fill-opacity="0.2"/>
    <text x="24" y="32" fill="#f97316" font-size="14" text-anchor="middle">⚡</text>
    <text x="46" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Heating Element</text>
    <text x="46" y="42" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">Rp85.000</text>
    <text x="180" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="end">SKU: HE-FR900</text>
    <!-- Pointer Line -->
    <path d="M 0 35 L -45 55" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="-45" cy="55" r="3" fill="#f97316"/>
  </g>

  <!-- Callout 2: Teflon Belt -->
  <g transform="translate(30, 45)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="24" y="32" fill="#f59e0b" font-size="14" text-anchor="middle">🛡️</text>
    <text x="46" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Teflon Belt 750mm</text>
    <text x="46" y="42" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">Rp65.000 <tspan fill="#94a3b8" font-size="9">/10pcs</tspan></text>
    <!-- Pointer Line -->
    <path d="M 180 35 L 260 70" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="260" cy="70" r="3" fill="#f59e0b"/>
  </g>

  <!-- Callout 3: Conveyor Motor -->
  <g transform="translate(30, 375)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="56" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="14" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="32" fill="#38bdf8" font-size="14" text-anchor="middle">⚙️</text>
    <text x="46" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Motor Dinamo 50W</text>
    <text x="46" y="42" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">Rp320.000</text>
    <!-- Pointer Line -->
    <path d="M 180 20 L 230 -60" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="230" cy="-60" r="3" fill="#0284c7"/>
  </g>

  <!-- Bottom machine tag -->
  <rect x="220" y="420" width="200" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="320" y="437" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">MODEL: FR-900 / SF-150 SERI</text>
</svg>
