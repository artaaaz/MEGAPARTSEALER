<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadowP2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="metalWireP2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="brassEyeletP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#fcfcfd"/>
  <ellipse cx="300" cy="320" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kawat Polos 02 (5mm Wide Flat Ribbon) -->
  <g transform="translate(100, 180)" filter="url(#softShadowP2)">
    <circle cx="20" cy="35" r="16" fill="url(#brassEyeletP2)" stroke="#eab308" stroke-width="1"/>
    <circle cx="20" cy="35" r="6" fill="#fcfcfd"/>
    <rect x="25" y="27" width="30" height="16" rx="2" fill="url(#brassEyeletP2)"/>

    <!-- 5mm Wide Flat Wire Ribbon -->
    <rect x="50" y="27" width="300" height="16" rx="2" fill="url(#metalWireP2)"/>
    <line x1="50" y1="30" x2="350" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="50" y1="40" x2="350" y2="40" stroke="#475569" stroke-width="0.75" opacity="0.5"/>

    <rect x="345" y="27" width="30" height="16" rx="2" fill="url(#brassEyeletP2)"/>
    <circle cx="380" cy="35" r="16" fill="url(#brassEyeletP2)" stroke="#eab308" stroke-width="1"/>
    <circle cx="380" cy="35" r="6" fill="#fcfcfd"/>
  </g>
</svg>
