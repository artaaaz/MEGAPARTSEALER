<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)" rx="12"/>
  <!-- Technical Grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>
  <!-- Technical Dimension lines -->
  <path d="M 50 240 L 350 240" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="50" cy="240" r="3" fill="#f97316"/>
  <circle cx="350" cy="240" r="3" fill="#f97316"/>
  <text x="200" y="258" fill="#f97316" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">300mm NICHROME BAR</text>
  
  <!-- Ceramic Holder Base -->
  <rect x="40" y="110" width="320" height="40" rx="4" fill="url(#metalGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Heating Element Glow Tube -->
  <rect x="55" y="122" width="290" height="16" rx="8" fill="url(#glowGrad)"/>
  
  <!-- Nichrome Coils -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.8">
    <path d="M 65 125 Q 70 120 75 125 T 85 125 T 95 125 T 105 125 T 115 125 T 125 125 T 135 125 T 145 125 T 155 125 T 165 125 T 175 125 T 185 125 T 195 125 T 205 125 T 215 125 T 225 125 T 235 125 T 245 125 T 255 125 T 265 125 T 275 125 T 285 125 T 295 125 T 305 125 T 315 125 T 325 125 T 335 125" fill="none"/>
  </g>

  <!-- Brass Eyelets / Terminals -->
  <circle cx="45" cy="130" r="10" fill="url(#copperGrad)" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="45" cy="130" r="4" fill="#0f172a"/>
  
  <circle cx="355" cy="130" r="10" fill="url(#copperGrad)" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="355" cy="130" r="4" fill="#0f172a"/>

  <!-- High Temp Lead Wires -->
  <path d="M 45 130 C 20 130 15 170 30 190 L 50 190" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <path d="M 355 130 C 380 130 385 170 370 190 L 350 190" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Badge -->
  <rect x="20" y="20" width="130" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
  <text x="85" y="37" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ HEATING ELEMENT</text>
  
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">220V / 300W</text>
</svg>
