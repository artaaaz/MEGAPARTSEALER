<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadowCloth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="clothWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#fcfcfd"/>
  <ellipse cx="300" cy="330" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kain Sealer (Fiberglass Woven Cloth) -->
  <g transform="translate(150, 110)" filter="url(#softShadowCloth)">
    <!-- Folded Woven Fabric Sheet -->
    <path d="M 40 40 L 260 20 L 280 200 L 60 220 Z" fill="url(#clothWhiteGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Delicate Fiberglass Woven Texture Grid -->
    <g stroke="#94a3b8" stroke-width="0.5" opacity="0.35">
      <line x1="60" y1="38" x2="80" y2="218"/>
      <line x1="80" y1="36" x2="100" y2="216"/>
      <line x1="100" y1="34" x2="120" y2="214"/>
      <line x1="120" y1="32" x2="140" y2="212"/>
      <line x1="140" y1="30" x2="160" y2="210"/>
      <line x1="160" y1="28" x2="180" y2="208"/>
      <line x1="180" y1="26" x2="200" y2="206"/>
      <line x1="200" y1="24" x2="220" y2="204"/>
      <line x1="220" y1="22" x2="240" y2="202"/>
      <line x1="240" y1="20" x2="260" y2="200"/>

      <line x1="45" y1="60" x2="265" y2="40"/>
      <line x1="50" y1="90" x2="270" y2="70"/>
      <line x1="55" y1="120" x2="275" y2="100"/>
      <line x1="60" y1="150" x2="280" y2="130"/>
      <line x1="65" y1="180" x2="285" y2="160"/>
    </g>

    <!-- Clean Fold Corner Edge -->
    <path d="M 260 20 L 220 60 L 280 60 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  </g>
</svg>
