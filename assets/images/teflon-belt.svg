<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="teflonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad2)" rx="12"/>
  <!-- Isometric Teflon Loop Belt -->
  <g transform="translate(40, 40)">
    <!-- Back loop -->
    <path d="M 60 70 C 60 40 260 40 260 70 L 260 110 C 260 140 60 140 60 110 Z" fill="#451a03" stroke="#b45309" stroke-width="2"/>
    <!-- Front loop -->
    <path d="M 40 100 C 40 60 280 60 280 100 L 280 140 C 280 180 40 180 40 140 Z" fill="url(#teflonGrad)" stroke="#fcd34d" stroke-width="2.5"/>
    <path d="M 50 110 C 50 80 270 80 270 110 L 270 130 C 270 160 50 160 50 130 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Texture weave pattern -->
    <g stroke="#fef3c7" stroke-width="0.75" opacity="0.2">
      <line x1="60" y1="90" x2="260" y2="150"/>
      <line x1="70" y1="85" x2="270" y2="145"/>
      <line x1="80" y1="80" x2="280" y2="140"/>
    </g>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b"/>
  <text x="80" y="37" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ TEFLON BELT</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">SEAMLESS 750mm</text>
</svg>
