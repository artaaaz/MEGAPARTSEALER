<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgThermo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgThermo)" rx="12"/>
  <!-- Digital Controller Housing (REX-C100 Style) -->
  <g transform="translate(110, 50)">
    <!-- Main Frame -->
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <rect x="10" y="10" width="160" height="180" rx="4" fill="#0f172a"/>
    
    <!-- LED Screen Top (PV - Red) -->
    <rect x="25" y="25" width="130" height="38" rx="4" fill="#000000" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="40" fill="#ef4444" font-family="'Courier New', monospace" font-size="10" font-weight="bold">PV</text>
    <text x="145" y="52" fill="#ef4444" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="end">180.0</text>
    <text x="148" y="38" fill="#ef4444" font-family="'Courier New', monospace" font-size="10">°C</text>

    <!-- LED Screen Bottom (SV - Green) -->
    <rect x="25" y="70" width="130" height="38" rx="4" fill="#000000" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="85" fill="#22c55e" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SV</text>
    <text x="145" y="97" fill="#22c55e" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="end">180.0</text>
    <text x="148" y="83" fill="#22c55e" font-family="'Courier New', monospace" font-size="10">°C</text>

    <!-- Status LEDs -->
    <circle cx="35" cy="122" r="4" fill="#22c55e"/>
    <text x="45" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">OUT1</text>
    <circle cx="95" cy="122" r="4" fill="#64748b"/>
    <text x="105" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">ALM1</text>

    <!-- Control Buttons -->
    <rect x="25" y="145" width="28" height="22" rx="3" fill="#334155" stroke="#64748b"/>
    <text x="39" y="159" fill="#f8fafc" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">SET</text>
    
    <rect x="60" y="145" width="28" height="22" rx="3" fill="#334155" stroke="#64748b"/>
    <text x="74" y="159" fill="#f8fafc" font-family="sans-serif" font-size="9" text-anchor="middle">&lt;</text>

    <rect x="95" y="145" width="28" height="22" rx="3" fill="#334155" stroke="#64748b"/>
    <text x="109" y="160" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">▼</text>

    <rect x="130" y="145" width="28" height="22" rx="3" fill="#334155" stroke="#64748b"/>
    <text x="144" y="160" fill="#f8fafc" font-family="sans-serif" font-size="10" text-anchor="middle">▲</text>
  </g>
  <rect x="20" y="20" width="130" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="85" y="37" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🌡️ THERMOSTAT</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">PID DIGITAL</text>
</svg>
