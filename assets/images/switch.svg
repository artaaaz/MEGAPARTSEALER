<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSw)" rx="12"/>
  <!-- Rocker Switch Rectangular Housing -->
  <g transform="translate(130, 60)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <!-- Switch Bezel -->
    <rect x="15" y="15" width="110" height="150" rx="4" fill="#1e293b"/>
    <!-- Rocker Button Top (Pressed) -->
    <path d="M 25 25 L 115 25 L 105 90 L 35 90 Z" fill="url(#rockerGrad)" stroke="#f87171" stroke-width="1.5"/>
    <text x="70" y="65" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">|</text>
    <!-- Rocker Button Bottom (Raised) -->
    <path d="M 35 90 L 105 90 L 115 155 L 25 155 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="70" cy="125" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="80" y="37" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔘 POWER SWITCH</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">4 PIN ILLUMINATED</text>
</svg>
