<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgKab)" rx="12"/>
  <!-- High Temp Silicone Cable with Stripped Copper Tip -->
  <g transform="translate(60, 60)">
    <!-- Red Wire Cable -->
    <path d="M 30 140 C 60 70 120 70 160 110 C 200 150 230 110 250 80" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>
    <!-- Stripped insulation -->
    <path d="M 250 80 L 275 60" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    
    <!-- White Wire Cable -->
    <path d="M 30 165 C 70 100 130 95 170 135 C 205 170 235 135 255 105" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
    <!-- Stripped insulation -->
    <path d="M 255 105 L 280 85" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>

    <!-- Ceramic Connector Block -->
    <rect x="270" y="40" width="40" height="65" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="290" cy="55" r="5" fill="#475569"/>
    <circle cx="290" cy="85" r="5" fill="#475569"/>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
  <text x="80" y="37" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔌 KABEL SILIKON</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">AWG 16 - 300°C</text>
</svg>
