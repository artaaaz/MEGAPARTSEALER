<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadowP1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="metalWireP1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="brassEyeletP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#fcfcfd"/>
  <ellipse cx="300" cy="320" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kawat Polos 01 (2mm Flat Smooth Ribbon) -->
  <g transform="translate(100, 185)" filter="url(#softShadowP1)">
    <circle cx="20" cy="30" r="16" fill="url(#brassEyeletP1)" stroke="#eab308" stroke-width="1"/>
    <circle cx="20" cy="30" r="6" fill="#fcfcfd"/>
    <rect x="25" y="27" width="30" height="6" rx="1" fill="url(#brassEyeletP1)"/>

    <!-- 2mm Sleek Flat Wire Ribbon -->
    <rect x="50" y="27" width="300" height="6" rx="1" fill="url(#metalWireP1)"/>
    <line x1="50" y1="28" x2="350" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

    <rect x="345" y="27" width="30" height="6" rx="1" fill="url(#brassEyeletP1)"/>
    <circle cx="380" cy="30" r="16" fill="url(#brassEyeletP1)" stroke="#eab308" stroke-width="1"/>
    <circle cx="380" cy="30" r="6" fill="#fcfcfd"/>
  </g>
</svg>
