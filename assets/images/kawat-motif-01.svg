<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="metalWire1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="brassEyelet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimal Background -->
  <rect width="600" height="450" fill="#fcfcfd"/>

  <!-- Subtle Studio Backdrop Pedestal -->
  <ellipse cx="300" cy="320" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kawat Motif 01 (Wave Pattern) -->
  <g transform="translate(100, 180)" filter="url(#softShadow)">
    <!-- Eyelet Left -->
    <circle cx="20" cy="35" r="16" fill="url(#brassEyelet)" stroke="#eab308" stroke-width="1"/>
    <circle cx="20" cy="35" r="6" fill="#fcfcfd"/>
    <rect x="25" y="30" width="30" height="10" rx="2" fill="url(#brassEyelet)"/>

    <!-- Main Nichrome Ribbon Base with Wave / Sine Motif Pattern -->
    <path d="M 50 30 L 350 30 L 350 40 L 50 40 Z" fill="url(#metalWire1)"/>

    <!-- Distinct Wave Waveform Motif -->
    <path d="M 55 35 Q 65 24 75 35 T 95 35 T 115 35 T 135 35 T 155 35 T 175 35 T 195 35 T 215 35 T 235 35 T 255 35 T 275 35 T 295 35 T 315 35 T 335 35 T 345 35" fill="none" stroke="#1B2CC1" stroke-width="2" opacity="0.7"/>
    <path d="M 55 35 Q 65 26 75 35 T 95 35 T 115 35 T 135 35 T 155 35 T 175 35 T 195 35 T 215 35 T 235 35 T 275 35 T 315 35 T 345 35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

    <!-- Eyelet Right -->
    <rect x="345" y="30" width="30" height="10" rx="2" fill="url(#brassEyelet)"/>
    <circle cx="380" cy="35" r="16" fill="url(#brassEyelet)" stroke="#eab308" stroke-width="1"/>
    <circle cx="380" cy="35" r="6" fill="#fcfcfd"/>
  </g>
</svg>
