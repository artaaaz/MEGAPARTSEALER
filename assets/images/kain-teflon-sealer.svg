<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadowTeflon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="teflonAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#fcfcfd"/>
  <ellipse cx="300" cy="330" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kain Teflon Sealer (PTFE Glossy Sheet) -->
  <g transform="translate(150, 110)" filter="url(#softShadowTeflon)">
    <path d="M 40 40 L 260 20 L 280 200 L 60 220 Z" fill="url(#teflonAmberGrad)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Smooth PTFE Specular Highlights -->
    <path d="M 70 45 L 240 30 L 250 110 L 80 125 Z" fill="#ffffff" opacity="0.08"/>
    
    <!-- Micro Glass Mesh Subsurface Pattern -->
    <g stroke="#fef3c7" stroke-width="0.35" opacity="0.2">
      <line x1="60" y1="38" x2="80" y2="218"/>
      <line x1="90" y1="35" x2="110" y2="215"/>
      <line x1="120" y1="32" x2="140" y2="212"/>
      <line x1="150" y1="29" x2="170" y2="209"/>
      <line x1="180" y1="26" x2="200" y2="206"/>
      <line x1="210" y1="23" x2="230" y2="203"/>
      <line x1="240" y1="20" x2="260" y2="200"/>

      <line x1="45" y1="70" x2="265" y2="50"/>
      <line x1="50" y1="110" x2="270" y2="90"/>
      <line x1="55" y1="150" x2="275" y2="130"/>
      <line x1="60" y1="190" x2="280" y2="170"/>
    </g>

    <!-- Fold Corner -->
    <path d="M 260 20 L 210 65 L 280 65 Z" fill="#78350f" stroke="#d97706" stroke-width="1"/>
  </g>
</svg>
