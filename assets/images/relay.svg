<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgRelay)" rx="12"/>
  <!-- SSR Solid State Relay Casing -->
  <g transform="translate(120, 50)">
    <rect x="0" y="0" width="160" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="15" y="15" width="130" height="160" rx="4" fill="#0f172a"/>
    
    <!-- Large Screw Terminals Output (1 & 2) -->
    <rect x="25" y="25" width="30" height="24" rx="3" fill="#cbd5e1"/>
    <circle cx="40" cy="37" r="5" fill="#475569"/>
    <line x1="37" y1="37" x2="43" y2="37" stroke="#ffffff" stroke-width="1.5"/>
    <text x="40" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">1 (LOAD)</text>

    <rect x="105" y="25" width="30" height="24" rx="3" fill="#cbd5e1"/>
    <circle cx="120" cy="37" r="5" fill="#475569"/>
    <line x1="117" y1="37" x2="123" y2="37" stroke="#ffffff" stroke-width="1.5"/>
    <text x="120" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">2 (LOAD)</text>

    <!-- Center Label -->
    <text x="80" y="90" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SSR-40 DA</text>
    <text x="80" y="105" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">SOLID STATE RELAY</text>
    <circle cx="80" cy="120" r="4" fill="#ef4444"/>
    <text x="80" y="133" fill="#94a3b8" font-size="8" text-anchor="middle">INPUT LED</text>

    <!-- Small Screw Terminals Input (3 & 4) -->
    <rect x="30" y="145" width="22" height="18" rx="2" fill="#cbd5e1"/>
    <circle cx="41" cy="154" r="3.5" fill="#475569"/>
    <text x="41" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">4 (-)</text>

    <rect x="108" y="145" width="22" height="18" rx="2" fill="#cbd5e1"/>
    <circle cx="119" cy="154" r="3.5" fill="#475569"/>
    <text x="119" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">3 (+)</text>
  </g>
  <rect x="20" y="20" width="100" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
  <text x="70" y="37" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ SSR RELAY</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">40A 24-380VAC</text>
</svg>
