<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="softShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="metalWire3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="brassEyelet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#fcfcfd"/>
  <ellipse cx="300" cy="320" rx="220" ry="40" fill="#f1f5f9" opacity="0.6"/>

  <!-- Product Illustration: Kawat Motif 03 (Diamond Mesh Cross Motif) -->
  <g transform="translate(100, 180)" filter="url(#softShadow3)">
    <circle cx="20" cy="35" r="16" fill="url(#brassEyelet3)" stroke="#eab308" stroke-width="1"/>
    <circle cx="20" cy="35" r="6" fill="#fcfcfd"/>
    <rect x="25" y="26" width="30" height="18" rx="2" fill="url(#brassEyelet3)"/>

    <!-- Main Wire Base -->
    <path d="M 50 26 L 350 26 L 350 44 L 50 44 Z" fill="url(#metalWire3)"/>

    <!-- Diamond Knurl Cross-hatch Pattern -->
    <g stroke="#1B2CC1" stroke-width="1" opacity="0.55">
      <line x1="60" y1="26" x2="78" y2="44"/>
      <line x1="75" y1="26" x2="93" y2="44"/>
      <line x1="90" y1="26" x2="108" y2="44"/>
      <line x1="105" y1="26" x2="123" y2="44"/>
      <line x1="120" y1="26" x2="138" y2="44"/>
      <line x1="135" y1="26" x2="153" y2="44"/>
      <line x1="150" y1="26" x2="168" y2="44"/>
      <line x1="165" y1="26" x2="183" y2="44"/>
      <line x1="180" y1="26" x2="198" y2="44"/>
      <line x1="195" y1="26" x2="213" y2="44"/>
      <line x1="210" y1="26" x2="228" y2="44"/>
      <line x1="225" y1="26" x2="243" y2="44"/>
      <line x1="240" y1="26" x2="258" y2="44"/>
      <line x1="255" y1="26" x2="273" y2="44"/>
      <line x1="270" y1="26" x2="288" y2="44"/>
      <line x1="285" y1="26" x2="303" y2="44"/>
      <line x1="300" y1="26" x2="318" y2="44"/>
      <line x1="315" y1="26" x2="333" y2="44"/>
      <line x1="330" y1="26" x2="348" y2="44"/>

      <!-- Cross direction -->
      <line x1="78" y1="26" x2="60" y2="44"/>
      <line x1="93" y1="26" x2="75" y2="44"/>
      <line x1="108" y1="26" x2="90" y2="44"/>
      <line x1="123" y1="26" x2="105" y2="44"/>
      <line x1="138" y1="26" x2="120" y2="44"/>
      <line x1="153" y1="26" x2="135" y2="44"/>
      <line x1="168" y1="26" x2="150" y2="44"/>
      <line x1="183" y1="26" x2="165" y2="44"/>
      <line x1="198" y1="26" x2="180" y2="44"/>
      <line x1="213" y1="26" x2="195" y2="44"/>
      <line x1="228" y1="26" x2="210" y2="44"/>
      <line x1="243" y1="26" x2="225" y2="44"/>
      <line x1="258" y1="26" x2="240" y2="44"/>
      <line x1="273" y1="26" x2="255" y2="44"/>
      <line x1="288" y1="26" x2="270" y2="44"/>
      <line x1="303" y1="26" x2="285" y2="44"/>
      <line x1="318" y1="26" x2="300" y2="44"/>
      <line x1="333" y1="26" x2="315" y2="44"/>
      <line x1="348" y1="26" x2="330" y2="44"/>
    </g>

    <rect x="345" y="26" width="30" height="18" rx="2" fill="url(#brassEyelet3)"/>
    <circle cx="380" cy="35" r="16" fill="url(#brassEyelet3)" stroke="#eab308" stroke-width="1"/>
    <circle cx="380" cy="35" r="6" fill="#fcfcfd"/>
  </g>
</svg>
