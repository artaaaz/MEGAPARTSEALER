<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSens)" rx="12"/>
  <!-- Thermocouple Sensor M6 Probe & Braided Wire -->
  <g transform="translate(60, 60)">
    <!-- Metal probe tip -->
    <rect x="220" y="85" width="60" height="16" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="280" cy="93" r="8" fill="#cbd5e1"/>
    <!-- M6 Threaded Nut -->
    <rect x="180" y="80" width="40" height="26" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <line x1="190" y1="80" x2="190" y2="106" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="80" x2="200" y2="106" stroke="#475569" stroke-width="2"/>
    <line x1="210" y1="80" x2="210" y2="106" stroke="#475569" stroke-width="2"/>
    <!-- Spring Strain Relief -->
    <rect x="140" y="85" width="40" height="16" fill="#64748b"/>
    <!-- Braided Cable Coil -->
    <path d="M 140 93 C 80 93 40 140 90 160 C 140 180 160 120 70 120 C 20 120 10 70 60 50" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="2,2"/>
    <!-- Fork Spade Terminals (Red + Blue) -->
    <path d="M 60 50 L 80 40" stroke="#ef4444" stroke-width="4"/>
    <path d="M 60 50 L 75 58" stroke="#3b82f6" stroke-width="4"/>
    <rect x="80" y="36" width="12" height="8" fill="#e2e8f0"/>
    <rect x="75" y="54" width="12" height="8" fill="#e2e8f0"/>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6"/>
  <text x="80" y="37" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">📡 SENSOR SUHU</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">TYPE K THERMOCOUPLE</text>
</svg>
