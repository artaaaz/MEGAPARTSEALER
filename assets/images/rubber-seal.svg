<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="silGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgRub)" rx="12"/>
  <!-- Extruded Silicone Profile Strip -->
  <g transform="translate(60, 80)">
    <!-- Isometric Extruded Bar -->
    <path d="M 30 50 L 220 20 L 250 60 L 60 90 Z" fill="url(#silGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 60 90 L 250 60 L 250 80 L 60 110 Z" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
    <path d="M 30 50 L 60 90 L 60 110 L 30 70 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Sponge Texture pattern -->
    <circle cx="80" cy="70" r="1.5" fill="#475569"/>
    <circle cx="110" cy="65" r="1.5" fill="#475569"/>
    <circle cx="140" cy="60" r="1.5" fill="#475569"/>
    <circle cx="170" cy="55" r="1.5" fill="#475569"/>
    <circle cx="200" cy="50" r="1.5" fill="#475569"/>
  </g>
  <rect x="20" y="20" width="130" height="26" rx="13" fill="#64748b" fill-opacity="0.2" stroke="#94a3b8"/>
  <text x="85" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ SILICONE RUBBER</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">FOOD GRADE -50~250°C</text>
</svg>
