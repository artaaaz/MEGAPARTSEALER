<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBrg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgBrg)" rx="12"/>
  <!-- Ball Bearing 608ZZ Section -->
  <g transform="translate(200, 150)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="80" fill="url(#ringGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Steel Balls -->
    <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1">
      <circle cx="0" cy="-50" r="12"/>
      <circle cx="35" cy="-35" r="12"/>
      <circle cx="50" cy="0" r="12"/>
      <circle cx="35" cy="35" r="12"/>
      <circle cx="0" cy="50" r="12"/>
      <circle cx="-35" cy="35" r="12"/>
      <circle cx="-50" cy="0" r="12"/>
      <circle cx="-35" cy="-35" r="12"/>
    </g>

    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="35" fill="url(#ringGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  </g>
  <rect x="20" y="20" width="100" height="26" rx="13" fill="#64748b" fill-opacity="0.2" stroke="#94a3b8"/>
  <text x="70" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚙️ BEARING</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">HIGH TEMP 608ZZ</text>
</svg>
