<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgCloth)" rx="12"/>
  <!-- Folded Teflon Sheet -->
  <g transform="translate(60, 60)">
    <path d="M 40 40 L 220 20 L 260 160 L 80 180 Z" fill="url(#clothGrad)" stroke="#f59e0b" stroke-width="2"/>
    <!-- Fold corner -->
    <path d="M 220 20 L 190 60 L 260 60 Z" fill="#b45309" stroke="#fcd34d" stroke-width="1.5"/>
    <!-- Grid weave lines -->
    <g stroke="#fef3c7" stroke-width="0.5" opacity="0.25">
      <line x1="60" y1="40" x2="100" y2="180"/>
      <line x1="90" y1="35" x2="130" y2="175"/>
      <line x1="120" y1="30" x2="160" y2="170"/>
      <line x1="150" y1="25" x2="190" y2="165"/>
      <line x1="180" y1="20" x2="220" y2="160"/>
    </g>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b"/>
  <text x="80" y="37" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ TEFLON SHEET</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">1000mm x 1000mm</text>
</svg>
