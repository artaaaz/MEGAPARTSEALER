<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgTim)" rx="12"/>
  <!-- Impulse Sealer Timer Board with Dial -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <!-- Large Dial -->
    <circle cx="100" cy="80" r="55" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Dial Numbers -->
    <text x="100" y="40" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">4</text>
    <text x="135" y="55" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">5</text>
    <text x="145" y="85" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">6</text>
    <text x="135" y="115" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">7</text>
    <text x="100" y="125" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">8</text>
    <text x="65" y="115" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">1</text>
    <text x="55" y="85" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">2</text>
    <text x="65" y="55" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">3</text>
    <!-- Knob Pointer -->
    <circle cx="100" cy="80" r="28" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <line x1="100" y1="80" x2="100" y2="55" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    
    <!-- LED indicator -->
    <circle cx="100" cy="150" r="6" fill="#ef4444"/>
    <text x="100" y="168" fill="#94a3b8" font-size="9" text-anchor="middle">HEATING INDICATOR</text>
  </g>
  <rect x="20" y="20" width="100" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
  <text x="70" y="37" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⏱️ TIMER PCB</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">0.2 - 2.5 DETIK</text>
</svg>
