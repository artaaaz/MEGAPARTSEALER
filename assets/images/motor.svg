<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="motGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgMot)" rx="12"/>
  <!-- Industrial Gearbox Motor -->
  <g transform="translate(60, 60)">
    <!-- Motor Body (Cylindrical Fin) -->
    <rect x="30" y="40" width="130" height="90" rx="8" fill="url(#motGrad)" stroke="#64748b" stroke-width="2"/>
    <!-- Cooling Fins -->
    <line x1="50" y1="40" x2="50" y2="130" stroke="#1e293b" stroke-width="3"/>
    <line x1="70" y1="40" x2="70" y2="130" stroke="#1e293b" stroke-width="3"/>
    <line x1="90" y1="40" x2="90" y2="130" stroke="#1e293b" stroke-width="3"/>
    <line x1="110" y1="40" x2="110" y2="130" stroke="#1e293b" stroke-width="3"/>
    <line x1="130" y1="40" x2="130" y2="130" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Gearbox Head -->
    <rect x="160" y="30" width="70" height="110" rx="6" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <!-- Output Shaft -->
    <rect x="230" y="75" width="40" height="20" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="250" y="70" width="10" height="30" rx="2" fill="#94a3b8"/>

    <!-- Terminal Box -->
    <rect x="60" y="15" width="50" height="25" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Mounting Bracket -->
    <rect x="150" y="140" width="90" height="20" rx="3" fill="#475569" stroke="#64748b"/>
    <circle cx="165" cy="150" r="4" fill="#0f172a"/>
    <circle cx="225" cy="150" r="4" fill="#0f172a"/>
  </g>
  <rect x="20" y="20" width="120" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
  <text x="80" y="37" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ DINAMO MOTOR</text>
  <text x="380" y="37" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="end">220V 50W GEARBOX</text>
</svg>
